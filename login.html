<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Adolescer com Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        saude: {
                            light: '#f5f3ff',
                            prime: '#7c3aed',
                            dark: '#4c1d95',
                            accent: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 selection:bg-saude-prime selection:text-white font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 transition-all hover:shadow-2xl">
        
        <div class="flex flex-col items-center mb-8">
            <div class="w-20 h-20 mb-4 flex items-center justify-center rounded-full bg-saude-light p-2 border border-purple-100">
                <img src="imagens/logo-vetor.png" alt="Logo Adolescer com Saúde" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl font-bold text-slate-800 text-center">Acesse o Portal</h1>
            <p class="text-sm text-slate-500 mt-1 text-center">Área de Membros do Projeto de Extensão. Insira suas credenciais.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">E-mail</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <input type="email" id="email" required autocomplete="email" placeholder="Insira seu E-mail"
                        class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-saude-prime focus:bg-white focus:ring-4 focus:ring-saude-prime/10 transition-all text-sm">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="text-sm font-medium text-slate-700">Senha</label>
                    <a href="#" class="text-xs font-semibold text-saude-prime hover:text-saude-dark transition-colors">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                        class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-saude-prime focus:bg-white focus:ring-4 focus:ring-saude-prime/10 transition-all text-sm">
                    
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer" aria-label="Mostrar senha">
                        <span id="eyeContainer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                    </button>
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 rounded text-saude-prime focus:ring-saude-prime/20 border-slate-300 accent-saude-prime">
                <label for="remember" class="ml-2 text-xs text-slate-500 select-none">Lembrar-me neste dispositivo</label>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-saude-prime hover:bg-saude-dark active:bg-saude-dark text-white font-semibold rounded-xl shadow-lg shadow-saude-prime/10 hover:shadow-saude-prime/20 focus:outline-none focus:ring-4 focus:ring-saude-prime/20 transition-all text-sm cursor-pointer mt-2 flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 flex flex-col items-center gap-3 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs text-slate-400 hover:text-slate-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                <span>Voltar para a página inicial</span>
            </a>
            
            <p class="text-xs text-slate-500 mt-1">
                Não tem uma conta? <a href="cadastro.html" class="text-saude-prime font-semibold hover:text-saude-dark hover:underline transition-colors">Cadastre-se</a>
            </p>
        </div>

    </div>

    <script>
        // 🟢 CONFIGURAÇÃO DO SUPABASE
        // IMPORTANTE: a URL deve ser a raiz do projeto, sem "/rest/v1/" no final —
        // o SDK monta os caminhos de auth/rest internamente.
        const SUPABASE_URL = "https://hqckepxhcwvlwbhdlriy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxY2tlcHhoY3d2bHdiaGRscml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMzcwMTQsImV4cCI6MjA5OTcxMzAxNH0.eycBrS1xDo3WX9MeRG2c9LYGR2nLTzK0zalxVj-TDWU";

        // Renomeado para "supabaseClient" para não sobrescrever o objeto global
        // "supabase" que o script do CDN cria (evita o erro
        // "Cannot access 'supabase' before initialization").
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('togglePassword');
        const eyeContainer = document.getElementById('eyeContainer');

        const svgOlhoAberto = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const svgOlhoFechado = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 10 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;

        togglePasswordButton.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                eyeContainer.innerHTML = svgOlhoFechado;
                togglePasswordButton.setAttribute('aria-label', 'Ocultar senha');
            } else {
                passwordInput.setAttribute('type', 'password');
                eyeContainer.innerHTML = svgOlhoAberto;
                togglePasswordButton.setAttribute('aria-label', 'Mostrar senha');
            }
        });

        // Evento estrutural de submit do formulário
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('Erro ao entrar: ' + error.message);
                return;
            }

            // Login bem-sucedido — redirecione para a área correta aqui.
            alert('Login realizado com sucesso!');
        });
    </script>
</body>
</html>
